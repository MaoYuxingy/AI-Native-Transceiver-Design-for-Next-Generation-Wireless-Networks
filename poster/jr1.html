<style>
@page{ size:594mm 841mm; margin:0 }
:root{
  /* Ink on paper. One accent for structure, one for the few numbers that carry the
     argument - everything else earns emphasis from position and type, not colour. */
  --paper:#FCFBF8; --ink:#1B1A18; --soft:#57534B;
  --rule:#CEC8BA; --rule-hard:#2B2A27;
  --navy:#17375E; --brick:#8C3A2B;
  --serif:Constantia,Cambria,Georgia,"Times New Roman",serif;
  --mono:Consolas,"Courier New",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:594mm;height:841mm;background:var(--paper);color:var(--ink);
  font-family:var(--serif);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet{width:594mm;height:841mm;display:flex;flex-direction:column;
  padding:17mm 18mm 0;overflow:hidden}

/* ---------- masthead ---------- */
.head{display:flex;gap:13mm;align-items:flex-start}
.head .brand{flex:none;width:62mm;padding-top:1.5mm}
.head .brand img{display:block;width:100%;height:auto}
.head .txt{flex:1}
.head h1{font-size:47pt;font-weight:700;line-height:1.06;letter-spacing:-.008em}
.head .auth{font-size:23pt;margin-top:5.5mm;color:var(--ink)}
.head .aff{font-size:17.5pt;margin-top:2mm;color:var(--soft)}
.head .qr{flex:none;width:31mm;text-align:center}
.head .qr svg{display:block;width:31mm;height:31mm}
.head .qr span{display:block;font-size:11pt;line-height:1.16;margin-top:1.6mm;
  color:var(--soft);white-space:nowrap}

/* ---------- the finding, stated once, before any detail ---------- */
.key{margin-top:8mm;border-top:1.1mm solid var(--rule-hard);
  border-bottom:0.3mm solid var(--rule);padding:5.5mm 0 5.5mm}
.key p{font-size:24pt;line-height:1.30}
.key b{font-weight:700}
.key .hi{color:var(--brick);font-weight:700}

/* ---------- two columns, divided by a rule rather than by boxes ---------- */
.body{flex:1;display:grid;grid-template-columns:1fr 1fr;column-gap:13mm;
  padding-top:7mm;align-content:start}
.col{min-width:0}
.col.l{border-right:0.3mm solid var(--rule);padding-right:13mm}

section{font-size:19.5pt;line-height:1.37}
section + section{margin-top:6.5mm;padding-top:6mm;border-top:0.3mm solid var(--rule)}
section h2{font-size:23pt;font-weight:700;line-height:1.15;margin-bottom:3.4mm;
  letter-spacing:.01em}
section h2 .n{color:var(--navy);margin-right:3mm;font-variant-numeric:lining-nums}
section p{margin-bottom:3mm}
section p:last-child{margin-bottom:0}
ul{list-style:none;margin-bottom:3mm}
ul:last-child{margin-bottom:0}
li{position:relative;padding-left:6mm;margin-bottom:2.6mm}
li:last-child{margin-bottom:0}
li::before{content:"\2013";position:absolute;left:0;color:var(--soft)}
b,strong{font-weight:700}
.hi{color:var(--brick);font-weight:700}
.q{font-family:var(--mono);font-size:0.92em}

/* ---------- figures and table ---------- */
figure{margin:4mm 0 0}
figure img,figure svg{display:block;width:100%;height:auto}
figcaption{font-size:15.5pt;line-height:1.28;color:var(--soft);margin-top:2.4mm}
figcaption b{color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:17pt;margin-top:3.5mm}
caption{caption-side:top;text-align:left;font-size:15.5pt;color:var(--soft);
  padding-bottom:2.2mm;line-height:1.28}
caption b{color:var(--ink)}
th,td{padding:1.9mm 2mm;text-align:right;border-bottom:0.25mm solid var(--rule)}
th:first-child,td:first-child{text-align:left;padding-left:0}
thead th{border-bottom:0.6mm solid var(--rule-hard);font-weight:700}
tbody tr:last-child td{border-bottom:0.6mm solid var(--rule-hard)}
/* Constantia defaults to old-style figures, which are right in running text and
   wrong in a column of numbers that has to be compared down the page. */
table{font-variant-numeric:lining-nums tabular-nums}
td.num{font-variant-numeric:lining-nums tabular-nums}
tr.best td{font-weight:700}

/* ---------- references ---------- */
.refs{margin-top:auto;border-top:0.3mm solid var(--rule);padding:4mm 0 6mm;
  font-size:12.5pt;line-height:1.32;color:var(--soft);
  display:grid;grid-template-columns:1fr 1fr;column-gap:13mm}
.refs div{break-inside:avoid}
.refs .lbl{color:var(--ink);font-weight:700}
</style>
