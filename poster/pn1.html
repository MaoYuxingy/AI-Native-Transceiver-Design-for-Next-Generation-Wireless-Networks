<style>
@page{ size:594mm 841mm; margin:0 }
:root{
  --navy:#17375E; --navy-dk:#0D2340; --navy-lt:#1F4E79;
  --red:#C00000; --bar:#2E75B6;
  --ink:#111111; --rule:#17375E;
  --sans:Arial,"Helvetica Neue",Helvetica,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:594mm;height:841mm;background:#fff;color:var(--ink);
  font-family:var(--sans);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet{width:594mm;height:841mm;display:flex;flex-direction:column;overflow:hidden}

/* ---------- header band ---------- */
.head{background:linear-gradient(100deg,var(--navy-dk) 0%,var(--navy) 45%,var(--navy-lt) 100%);
  color:#fff;padding:10mm 18mm 8mm;display:flex;gap:14mm;align-items:flex-start}
/* Official reversed (white) lockup, University Logo 2022. Sized to the width the
   text wordmark used, so the title keeps the same room and stays on two lines. */
.head .mark{width:85mm;height:auto;flex:none;align-self:center}
.head .bar{width:1.4mm;align-self:stretch;background:var(--bar);border-radius:1mm}
.head .txt{flex:1}
.head h1{font-size:46pt;font-weight:700;line-height:1.09;letter-spacing:-.005em}
.head .auth{font-size:24pt;margin-top:5mm;color:#D6E4F0}
.head .aff{font-size:19pt;margin-top:2.5mm;color:#A9C3DC}
/* Links to the repository. Dark-on-white, not reversed out of the navy: scanners
   are unreliable on inverted symbols, so the code keeps its own white tile. */
.head .qr{flex:none;width:34mm;align-self:center;text-align:center}
.head .qr svg{display:block;width:34mm;height:34mm}
.head .qr span{display:block;font-size:12pt;line-height:1.18;margin-top:1.8mm;
  color:#A9C3DC;white-space:nowrap}

/* ---------- body grid ---------- */
.body{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12mm;
  padding:5mm 16mm 0;align-content:start;counter-reset:card}
.col{display:flex;flex-direction:column;gap:5mm}

/* ---------- card ---------- */
.card{border:1.1mm solid var(--navy);border-radius:3mm;overflow:hidden;background:#fff;
  display:flex;flex-direction:column}
.card > h2{background:var(--navy);color:#fff;font-size:27pt;font-weight:400;
  padding:2.3mm 5.5mm 2.5mm;line-height:1.1}
/* Left column numbers 1-4, right column 5-8, following DOM order. */
.card > h2::before{counter-increment:card;content:counter(card);
  color:var(--bar);font-weight:700;margin-right:3.4mm}
.card .in{padding:3.6mm 5.5mm 3.6mm;font-size:19pt;line-height:1.32}
.card p{margin-bottom:2.9mm}
.card p:last-child{margin-bottom:0}
.card ul{list-style:none;margin-bottom:3.2mm}
.card ul:last-child{margin-bottom:0}
.card li{position:relative;padding-left:6mm;margin-bottom:2.2mm}
.card li:last-child{margin-bottom:0}
.card li::before{content:"\2022";position:absolute;left:0;top:-0.4mm;
  font-size:24pt;line-height:1;color:var(--ink)}
b,strong{font-weight:700}
.r{color:var(--red);font-weight:700}
.n{font-weight:700}
/* Full column width everywhere: the supervisor asked for the figures to be larger, and
   the space comes from the explanatory text that used to sit around them. */
figure{margin:2.4mm auto 0;width:100%}
figure img{display:block;width:100%;height:auto}
figcaption{font-size:16pt;color:#3d4a57;margin-top:2mm;line-height:1.3}

/* ---------- table ---------- */
table{width:100%;border-collapse:collapse;font-size:17pt;margin-top:1mm;
  font-variant-numeric:lining-nums tabular-nums}
caption{caption-side:top;text-align:left;font-size:15.5pt;color:#3d4a57;
  padding-bottom:2mm;line-height:1.28}
caption b{color:var(--ink)}
th,td{padding:1.7mm 2mm;text-align:right;border-bottom:0.25mm solid #C9D2DC}
th:first-child,td:first-child{text-align:left;padding-left:0}
thead th{border-bottom:0.6mm solid var(--navy);font-weight:700}
tbody tr:last-child td{border-bottom:0.6mm solid var(--navy)}
tr.best td{font-weight:700}

/* ---------- references + footer bar ---------- */
/* A plain block at the foot of the left column, where the spare space was. It carries
   no title bar of its own: the reference list is apparatus, not a ninth finding. */
.refs{padding:1mm 1mm 0}
.refs h3{font-size:21pt;font-weight:700;color:var(--navy);margin-bottom:2.4mm}
.refs .reflist{font-size:13pt;line-height:1.3;color:#333}
.refs .reflist div{padding-left:7mm;text-indent:-7mm;margin-bottom:1.7mm;break-inside:avoid}
.refs .reflist div:last-child{margin-bottom:0}
.refs .lbl{color:var(--ink);font-weight:700}
.foot{height:5mm;background:linear-gradient(90deg,var(--navy) 0%,var(--bar) 100%)}
</style>
